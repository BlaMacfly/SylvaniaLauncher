[package]
name = "sylvania-launcher"
version = "3.1.0"
edition = "2024"
description = "Sylvania Launcher - World of Warcraft 3.3.5a"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "SylvaniaLauncher"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.37", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rfd = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
hex = "0.4"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-mp3"] }
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.27"
tauri-winrt-notification = "0.8"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

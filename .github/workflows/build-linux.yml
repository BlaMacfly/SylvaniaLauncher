name: Build Linux AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-appimage:
    name: Build AppImage (Ubuntu 22.04, Qt 6.5.3, embedded Wine)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make pkg-config file wget xz-utils \
            desktop-file-utils patchelf python3-pip \
            libzip-dev \
            libgl-dev libglu1-mesa-dev libopengl0 \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfontconfig1 libfreetype6 \
            libfuse2 zsync

      - name: Install Qt 6.5.3 (aqtinstall)
        run: |
          pip3 install "aqtinstall==3.1.18"
          aqt install-qt linux desktop 6.5.3 gcc_64 \
            -m qtmultimedia qtimageformats \
            -O "${HOME}/qt"
          echo "QT_ROOT=${HOME}/qt/6.5.3/gcc_64" >> "$GITHUB_ENV"
          echo "${HOME}/qt/6.5.3/gcc_64/bin" >> "$GITHUB_PATH"

      - name: Cache pinned Wine tarball
        uses: actions/cache@v4
        with:
          path: linux/.cache
          key: wine-10.8-staging-amd64-wow64

      - name: Build AppImage (single source of truth: linux/build-appimage.sh)
        run: bash linux/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SylvaniaLauncher-Linux-AppImage
          path: build-appimage/SylvaniaLauncher-*-x86_64.AppImage

      - name: Upload ldd audit report
        uses: actions/upload-artifact@v4
        with:
          name: ldd-report
          path: build-appimage/ldd-report.txt
          if-no-files-found: ignore

      - name: Upload to Release (if tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-appimage/SylvaniaLauncher-*-x86_64.AppImage
          draft: false
          prerelease: false
